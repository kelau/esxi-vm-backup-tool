repository = "./backups"
# Optional passive mirror. Use a different physical device or network location.
secondary_repository = ""
chunk_size_mib = 8
compression_level = 6
pipeline_workers = 2
parallel_disks = 2
max_concurrent_backups = 1
quiesce = true
show_all_navigation_tabs = false

[server]
host = "esxi.example.net"
username = "backup-service"
password = "change-me" # Prefer ESXI_BACKUP_PASSWORD for scheduled jobs.
port = 443
verify_ssl = true
ssh_enabled = false # Enable for hot backups when standalone ESXi rejects snapshot export.
ssh_port = 22
ssh_username = "root"
ssh_password = "change-me" # Prefer ESXI_BACKUP_SSH_PASSWORD.
ssh_verify_host_key = true

# Optional Portainer integration:
# [portainer]
# url = "https://portainer.example.net:9443"
# api_key = "ptr_your_access_token"
# verify_ssl = true
# pause_during_backup = true
# include_bind_mounts = false

[retention]
keep_last = 7
keep_daily = 14
keep_weekly = 8
keep_monthly = 12
