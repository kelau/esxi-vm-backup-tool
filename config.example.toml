repository = "./backups"
chunk_size_mib = 8
compression_level = 6
pipeline_workers = 2
parallel_disks = 2
quiesce = true

[server]
host = "esxi.example.net"
username = "backup-service"
password = "change-me" # Prefer ESXI_BACKUP_PASSWORD for scheduled jobs.
port = 443
verify_ssl = true

[retention]
keep_last = 7
keep_daily = 14
keep_weekly = 8
keep_monthly = 12
