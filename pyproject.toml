[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esxi-vm-backup"
version = "0.1.0"
description = "Hot, deduplicated ESXi virtual-machine backups with CLI and web UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ESXi VM Backup Tool contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "platformdirs>=4.2,<5",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyvmomi>=8.0.3,<9",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
esxi-backup = "esxi_backup.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/esxi_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

