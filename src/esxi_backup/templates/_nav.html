<style>
html{overflow-y:scroll;scrollbar-gutter:stable}
.app-shell{display:block;position:sticky;top:0;z-index:50;width:auto;background:#0b1020ee;backdrop-filter:blur(10px);padding:14px 0 10px;border-bottom:1px solid #26304a;margin-bottom:20px}.app-shell-row{display:flex;align-items:center;justify-content:space-between;gap:18px}.app-title{font-size:21px;font-weight:750;white-space:nowrap}.app-title small{font-size:13px;color:#91a0bc}.app-nav{display:flex;align-items:center;gap:4px}.app-tabs{display:flex;gap:4px;overflow:auto}.app-tab{position:relative;color:#91a0bc;text-decoration:none;padding:8px 11px;border-radius:7px;white-space:nowrap}.app-tab:hover,.tools-menu summary:hover{color:#eef3ff;background:#1a2338}.app-tab.active,.tools-menu.active summary{color:#8af0cc;background:#173a31}.tools-menu{position:relative}.tools-menu summary{display:grid;place-items:center;list-style:none;width:36px;height:36px;border-radius:7px;color:#91a0bc;cursor:pointer;font-size:20px}.tools-menu summary::-webkit-details-marker{display:none}.tools-popup{position:absolute;right:0;top:43px;min-width:210px;padding:7px;background:#1a2338;border:1px solid #34415f;border-radius:9px;box-shadow:0 14px 35px #0009}.tools-popup .app-tab{display:flex;justify-content:space-between;align-items:center}.tab-badge{display:none;min-width:16px;height:16px;padding:0 4px;margin-left:4px;border-radius:9px;background:#ff748a;color:#23050a;font-size:11px;font-weight:700;text-align:center;line-height:16px}.tab-badge.visible{display:inline-block}@media(max-width:700px){.app-title{font-size:18px}.app-shell-row{gap:8px}}
.tab-badge.urgency-info{background:#6e9cff;color:#07142b}.tab-badge.urgency-advisory{background:#ffd479;color:#2b2104}.tab-badge.urgency-warning{background:#ff9f68;color:#2b1003}.tab-badge.urgency-critical{background:#ff748a;color:#300711}
</style>
<header class="app-shell"><div class="app-shell-row"><div class="app-title">ESXi VM Backup <small>v{{ app_version }}</small></div><nav class="app-nav" aria-label="Application"><div class="app-tabs"><a class="app-tab{% if active_page=='dashboard' %} active{% endif %}" href="/" data-tab="dashboard">VMs<span class="tab-badge"></span></a><a class="app-tab{% if active_page=='tasks' %} active{% endif %}" href="/tasks" data-tab="tasks">Tasks<span class="tab-badge"></span></a></div><details class="tools-menu{% if active_page in ['datastores','schedules','settings','updates'] %} active{% endif %}"><summary aria-label="Tools" title="Tools">&#128736;</summary><div class="tools-popup"><a class="app-tab{% if active_page=='datastores' %} active{% endif %}" href="/datastores" data-tab="datastores">Datastores<span class="tab-badge"></span></a><a class="app-tab{% if active_page=='schedules' %} active{% endif %}" href="/schedules" data-tab="schedules">Schedules<span class="tab-badge"></span></a><a class="app-tab{% if active_page=='settings' %} active{% endif %}" href="/settings" data-tab="settings">Settings<span class="tab-badge"></span></a><a class="app-tab{% if active_page=='updates' %} active{% endif %}" href="/updates" data-tab="updates">Updates<span class="tab-badge"></span></a></div></details></nav></div></header>
<script>
function paintTabNotice(tab,item){const badge=document.querySelector('[data-tab="'+tab+'"] .tab-badge');if(badge&&item.count){badge.textContent=item.count;badge.title=item.message;badge.className='tab-badge visible urgency-'+(item.urgency||'info')}}
function detectApplicationUpdate(){fetch('/api/v1/update/check',{cache:'no-store'}).then(r=>r.json()).then(item=>{if(item.available)paintTabNotice('updates',{count:1,message:'Version '+item.latest_version+' is available',urgency:'info'})}).catch(()=>{})}
fetch('/api/v1/notifications',{cache:'no-store'}).then(r=>r.json()).then(items=>Object.entries(items).forEach(([tab,item])=>paintTabNotice(tab,item))).catch(()=>{});detectApplicationUpdate();setInterval(detectApplicationUpdate,900000);
document.addEventListener('click',event=>document.querySelectorAll('details.tools-menu[open]').forEach(menu=>{if(!menu.contains(event.target))menu.removeAttribute('open')}));
</script>
