<style>
.app-shell{position:sticky;top:0;z-index:50;background:#0b1020ee;backdrop-filter:blur(10px);padding:14px 0 10px;border-bottom:1px solid #26304a;margin-bottom:20px}.app-shell-row{display:flex;align-items:center;justify-content:space-between;gap:18px}.app-title{font-size:21px;font-weight:750;white-space:nowrap}.app-title small{font-size:13px;color:#91a0bc}.app-tabs{display:flex;gap:4px;overflow:auto}.app-tab{position:relative;color:#91a0bc;text-decoration:none;padding:8px 11px;border-radius:7px;white-space:nowrap}.app-tab:hover{color:#eef3ff;background:#1a2338}.app-tab.active{color:#8af0cc;background:#173a31}.tab-badge{display:none;min-width:16px;height:16px;padding:0 4px;margin-left:4px;border-radius:9px;background:#ff748a;color:#23050a;font-size:11px;font-weight:700;text-align:center;line-height:16px}.tab-badge.visible{display:inline-block}@media(max-width:700px){.app-shell-row{align-items:flex-start;flex-direction:column}.app-tabs{width:100%}}
.tab-badge.urgency-info{background:#6e9cff;color:#07142b}.tab-badge.urgency-advisory{background:#ffd479;color:#2b2104}.tab-badge.urgency-warning{background:#ff9f68;color:#2b1003}.tab-badge.urgency-critical{background:#ff748a;color:#300711}
</style>
<header class="app-shell"><div class="app-shell-row"><div class="app-title">ESXi VM Backup <small>v{{ app_version }}</small></div><nav class="app-tabs" aria-label="Application"><a class="app-tab{% if active_page=='dashboard' %} active{% endif %}" href="/" data-tab="dashboard">VMs<span class="tab-badge"></span></a><a class="app-tab{% if active_page=='datastores' %} active{% endif %}" href="/datastores" data-tab="datastores">Datastores<span class="tab-badge"></span></a><a class="app-tab{% if active_page=='schedules' %} active{% endif %}" href="/schedules" data-tab="schedules">Schedules<span class="tab-badge"></span></a><a class="app-tab{% if active_page=='settings' %} active{% endif %}" href="/settings" data-tab="settings">Settings<span class="tab-badge"></span></a><a class="app-tab{% if active_page=='updates' %} active{% endif %}" href="/updates" data-tab="updates">Updates<span class="tab-badge"></span></a></nav></div></header>
<script>
function paintTabNotice(tab,item){const badge=document.querySelector('[data-tab="'+tab+'"] .tab-badge');if(badge&&item.count){badge.textContent=item.count;badge.title=item.message;badge.className='tab-badge visible urgency-'+(item.urgency||'info')}}
function detectApplicationUpdate(){fetch('/api/v1/update/check',{cache:'no-store'}).then(r=>r.json()).then(item=>{if(item.available)paintTabNotice('updates',{count:1,message:'Version '+item.latest_version+' is available',urgency:'info'})}).catch(()=>{})}
fetch('/api/v1/notifications',{cache:'no-store'}).then(r=>r.json()).then(items=>Object.entries(items).forEach(([tab,item])=>paintTabNotice(tab,item))).catch(()=>{});detectApplicationUpdate();setInterval(detectApplicationUpdate,900000);
</script>
