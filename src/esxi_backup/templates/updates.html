<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Updates · ESXi Backup</title><style>:root{color-scheme:dark;--bg:#0b1020;--panel:#141b2d;--muted:#91a0bc;--accent:#58d6a9;--bad:#ff748a}body{font:15px system-ui;margin:0;background:var(--bg);color:#eef3ff}main{box-sizing:border-box;width:100%;max-width:1164px;margin:auto;padding:0 32px 32px}a{color:var(--accent)}h1{font-size:24px}.card{background:var(--panel);border-radius:10px;padding:20px;margin:18px 0}.muted{color:var(--muted)}.error{color:var(--bad)}button{background:var(--accent);border:0;padding:10px 15px;border-radius:6px;color:#08140f;font-weight:650;cursor:pointer}button:disabled{opacity:.55;cursor:wait}pre{min-height:220px;max-height:55vh;overflow:auto;background:#050914;border:1px solid #26304a;border-radius:8px;padding:14px;color:#c8d5ef;white-space:pre-wrap}.release{border-top:1px solid #26304a;padding:14px 0}.release:first-child{border:0}</style></head><body><main>{% set active_page='updates' %}{% include '_nav.html' %}
<h1>Application updates</h1><section class="card"><p id="update-summary">Checking GitHub for releases…</p><button id="check-update">Check now</button> <button id="install-update" hidden>Install update</button><p id="update-error" class="error"></p><div id="update-output" hidden><h2>Installer output</h2><pre id="update-log">Waiting for installer output…</pre></div></section>
<section class="card"><h2>Available releases</h2><div id="release-list" class="muted">Loading…</div></section>
<script>
const summary=document.getElementById('update-summary'),checkButton=document.getElementById('check-update'),button=document.getElementById('install-update'),errorBox=document.getElementById('update-error'),releaseList=document.getElementById('release-list'),output=document.getElementById('update-output'),log=document.getElementById('update-log');let currentVersion='{{ app_version }}',pollTimer;
const escapeHtml=value=>{const e=document.createElement('span');e.textContent=value;return e.innerHTML};
async function checkUpdates(force=false){checkButton.disabled=true;checkButton.textContent='Checking…';errorBox.textContent='';try{const r=await fetch('/api/v1/update/check'+(force?'?refresh=true':''),{cache:'no-store'}),data=await r.json();if(!r.ok)throw new Error(data.detail||r.statusText);currentVersion=data.current_version;const checked=data.checked_at?' Checked '+new Date(data.checked_at).toLocaleString()+'.':'';summary.textContent=(data.available?'Version '+data.latest_version+' is available. You have '+data.current_version+'.':'Version '+data.current_version+' is up to date.')+checked;button.hidden=!data.available||!data.enabled;releaseList.innerHTML=data.releases.map(item=>'<article class="release"><strong>'+escapeHtml(item.name||item.tag_name)+'</strong> · '+new Date(item.published_at).toLocaleString()+'<p>'+escapeHtml(item.body||'No release notes.')+'</p></article>').join('')||'No releases found.';}catch(error){errorBox.textContent='Update check failed: '+error.message;summary.textContent='Could not check for updates.'}finally{checkButton.disabled=false;checkButton.textContent='Check now'}}
async function pollStatus(){try{const r=await fetch('/api/v1/update/status',{cache:'no-store'}),data=await r.json();if(!r.ok)throw new Error(data.detail||r.statusText);log.textContent=data.log||(data.error||'Waiting for installer output…');errorBox.textContent=data.error||'';log.scrollTop=log.scrollHeight;if(data.version!==currentVersion){location.reload();return}}catch(error){errorBox.textContent='Could not read installer status: '+error.message}pollTimer=setTimeout(pollStatus,1500)}
checkButton.addEventListener('click',()=>checkUpdates(true));button.addEventListener('click',async()=>{if(!confirm('Install the latest release? The web service will restart and active backups may be interrupted.'))return;button.disabled=true;button.textContent='Updating…';output.hidden=false;errorBox.textContent='';try{const r=await fetch('/api/v1/update',{method:'POST'}),data=await r.json();if(!r.ok)throw new Error(data.detail||r.statusText);pollStatus()}catch(error){errorBox.textContent=error.message;button.disabled=false;button.textContent='Install update'}});checkUpdates();setInterval(checkUpdates,900000);
</script></main></body></html>
